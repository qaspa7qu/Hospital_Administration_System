# Test profile: in-memory H2 in MySQL compatibility mode.
# Allows running JUnit tests without a locally installed MySQL server.
spring.datasource.url=jdbc:h2:mem:clinic_schedule_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.data-locations=
