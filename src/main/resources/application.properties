# ============================================================
# Основные настройки приложения
# ============================================================
spring.application.name=clinic-schedule-backend
server.port=${SERVER_PORT:8080}

# ============================================================
# Подключение к MySQL
# Значения можно переопределить переменными окружения:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinic_schedule?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# Для разработки схема обновляется автоматически.
# Для production используйте JPA_DDL_AUTO=validate и миграции.
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.maximum-pool-size=10

# ============================================================
# JWT
# JWT_SECRET — Base64-строка длиной не менее 32 байт.
# Значение по умолчанию только для локальной разработки.
# ============================================================
app.jwt.secret=${JWT_SECRET:aG9zcGl0YWwtYXBwb2ludG1lbnQtc3lzdGVtLWRldi1qd3Qtc2VjcmV0LTIwMjY=}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.jwt.issuer=${JWT_ISSUER:hospital-appointment-system}

# ============================================================
# Стартовый администратор.
# Создаётся только если пользователя с таким логином ещё нет.
# Для production обязательно задайте свои значения.
# ============================================================
app.bootstrap.admin.username=${ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${ADMIN_PASSWORD:admin123}
app.bootstrap.admin.full-name=${ADMIN_FULL_NAME:\u0410\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u043E\u0440}
