# ============================================================
# H2 in-memory database profile (for local development without MySQL)
# Activate with: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=h2"
# ============================================================

spring.datasource.url=jdbc:h2:mem:clinic_schedule;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data.sql